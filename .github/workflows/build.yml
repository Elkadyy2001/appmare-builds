name: AppMare Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build target'
        required: true
        type: choice
        options:
          - Androidnewapk
          - androidkeystore
          - playnew
          - playkey
          - IOS
          - MAC
          - Windows
          - Web
          - WebServer
          - WebCloudRun
          - WebAzure
      track:
        description: 'Play Store track (Android Play only)'
        type: choice
        options: [production, beta, alpha, internal]
        default: production
      env_id:
        description: 'Environment ID (set by AppMare, contains build secrets)'
        required: true
        type: string
      ai_provider:
        description: 'AI provider for auto-fix (anthropic | openai | google | groq | openrouter)'
        type: string
        default: anthropic
      ai_model:
        description: 'AI model for auto-fix (e.g. claude-sonnet-4-5, gpt-4o)'
        type: string
        default: claude-sonnet-4-5
      retry:
        description: 'Auto-retry flag (set by bot, do not set manually)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:

  # ── Android ────────────────────────────────────────────────────────────────
  android:
    runs-on: macos-latest
    environment: ${{ inputs.env_id }}
    if: contains(fromJson('["Androidnewapk","androidkeystore","playnew","playkey"]'), inputs.platform)
    steps:
      - uses: actions/checkout@v4

      - name: Build & Auto-fix
        env:
          PROJECTURL:       ${{ secrets.PROJECTURL }}
          KEYSTOREALIAS:    ${{ secrets.KEYSTOREALIAS }}
          KEYSTOREPASS:     ${{ secrets.KEYSTOREPASS }}
          KEYURL:           ${{ secrets.KEYURL }}
          PLAYDATA:         ${{ secrets.PLAYDATA }}
          PLAY_TRACK:       ${{ inputs.track }}
          ONESIGNALAPI:     ${{ secrets.ONESIGNALAPI }}
          ONESIGNAL_SUB_ID: ${{ secrets.ONESIGNAL_SUB_ID }}
          AI_API_KEY:       ${{ secrets.AI_API_KEY }}
          GH_TOKEN:         ${{ secrets.PAT }}
        run: |
          MAX_RETRIES=5
          for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do
            bash .github/scripts/build.sh "${{ inputs.platform }}" 2>&1 | tee /tmp/build_output.txt
            BUILD_EXIT=${PIPESTATUS[0]}

            # Upload artifacts regardless
            if [ -n "${aab-path:-}" ] || [ -n "${apk-path:-}" ] || [ -n "${key-path:-}" ] || [ -n "${creds-path:-}" ]; then
              echo "Artifacts found — would upload in separate step"
            fi

            [ "$BUILD_EXIT" -eq 0 ] && break

            # Don't autofix on re-triggered runs
            [ "${{ inputs.retry }}" == "true" ] && break

            # Post the failure to the live feed issue before auto-fix starts, so the
            # real build error can be read while the run is still going.
            { echo "**${{ inputs.platform }}** build failed (attempt $attempt): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; echo 'Errors:'; echo '```'; grep -E ' error |error:|ERROR' /tmp/build_output.txt | sort -u | head -150; echo '```'; echo 'Log tail:'; echo '```'; tail -c 40000 /tmp/build_output.txt; echo '```'; } > /tmp/build_report.md
            GH_TOKEN="${{ github.token }}" gh issue comment 1 -R "${{ github.repository }}" --body-file /tmp/build_report.md || true

            bash .github/scripts/autofix.sh \
              --provider "${{ inputs.ai_provider }}" \
              --model    "${{ inputs.ai_model }}" \
              --api-key  "$AI_API_KEY" \
              --build-cmd "dotnet build SampleApp/SampleApp.csproj" \
              --prompt   "GitHub Actions build failed for platform ${{ inputs.platform }}. Full output:\n$(cat /tmp/build_output.txt)\nFix .github/scripts/build.sh or SampleApp/ files. Do NOT touch .github/workflows/build.yml.\n\nIMPORTANT: If you see casting errors with App.SharedVariables, look at how the variable is assigned in the code and find its real type. NEVER cast to dynamic — it breaks under AOT."

            # Check if AI needs user input
            if [ -f .autofix-needs-user.md ]; then
              NEEDS_USER=$(cat .autofix-needs-user.md)
              echo "=== AI requires user input ==="
              echo "$NEEDS_USER"
              curl -sf --location 'https://api.onesignal.com/notifications' \
                --header 'Content-Type: application/json' \
                --header "Authorization: Basic ${ONESIGNALAPI}" \
                --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed — user input needed for ${{ inputs.platform }}: ${NEEDS_USER:0:200}\"}}"
              exit 1
            fi



            echo ">>> Autofix applied, retry attempt $((attempt+1))/$MAX_RETRIES..."
          done

          # Notify only after the final result
          if [ "$BUILD_EXIT" -ne 0 ]; then
            curl -sf --location 'https://api.onesignal.com/notifications' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Basic ${ONESIGNALAPI}" \
              --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed for ${{ inputs.platform }}\"}}"
          fi

          exit "$BUILD_EXIT"


      # Hand the build outputs to the server (it downloads this artifact by name).
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-build
          if-no-files-found: ignore
          path: |
            ${{ env.aab-path }}
            ${{ env.apk-path }}
            ${{ env.key-path }}
            ${{ env.creds-path }}

  # ── Apple (iOS + macOS) ───────────────────────────────────────────────────
  apple:
    runs-on: macos-15
    environment: ${{ inputs.env_id }}
    if: inputs.platform == 'IOS' || inputs.platform == 'MAC'
    steps:
      - uses: actions/checkout@v4

      - name: Build & Auto-fix
        env:
          PROJECTURL:       ${{ secrets.PROJECTURL }}
          APIKEY:           ${{ secrets.APIKEY }}
          KEYID:            ${{ secrets.KEYID }}
          ISSUERID:         ${{ secrets.ISSUERID }}
          PAT:              ${{ secrets.PAT }}
          GITURL:           ${{ secrets.GITURL }}
          ONESIGNALAPI:     ${{ secrets.ONESIGNALAPI }}
          ONESIGNAL_SUB_ID: ${{ secrets.ONESIGNAL_SUB_ID }}
          AI_API_KEY:       ${{ secrets.AI_API_KEY }}
          GH_TOKEN:         ${{ secrets.PAT }}
        run: |
          MAX_RETRIES=5
          for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do
            bash .github/scripts/build.sh "${{ inputs.platform }}" 2>&1 | tee /tmp/build_output.txt
            BUILD_EXIT=${PIPESTATUS[0]}
            [ "$BUILD_EXIT" -eq 0 ] && break

            [ "${{ inputs.retry }}" == "true" ] && break

            # Post the failure to the live feed issue before auto-fix starts, so the
            # real build error can be read while the run is still going.
            { echo "**${{ inputs.platform }}** build failed (attempt $attempt): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; echo 'Errors:'; echo '```'; grep -E ' error |error:|ERROR' /tmp/build_output.txt | sort -u | head -150; echo '```'; echo 'Log tail:'; echo '```'; tail -c 40000 /tmp/build_output.txt; echo '```'; } > /tmp/build_report.md
            GH_TOKEN="${{ github.token }}" gh issue comment 1 -R "${{ github.repository }}" --body-file /tmp/build_report.md || true

            bash .github/scripts/autofix.sh \
              --provider "${{ inputs.ai_provider }}" \
              --model    "${{ inputs.ai_model }}" \
              --api-key  "$AI_API_KEY" \
              --build-cmd "dotnet build SampleApp/SampleApp.csproj" \
              --prompt   "GitHub Actions build failed for platform ${{ inputs.platform }}. Full output:\n$(cat /tmp/build_output.txt)\nFix .github/scripts/build.sh or SampleApp/ files. Do NOT touch .github/workflows/build.yml.\n\nIMPORTANT: If you see casting errors with App.SharedVariables, look at how the variable is assigned in the code and find its real type. NEVER cast to dynamic — it breaks under AOT."

            if [ -f .autofix-needs-user.md ]; then
              NEEDS_USER=$(cat .autofix-needs-user.md)
              echo "=== AI requires user input ==="
              echo "$NEEDS_USER"
              curl -sf --location 'https://api.onesignal.com/notifications' \
                --header 'Content-Type: application/json' \
                --header "Authorization: Basic ${ONESIGNALAPI}" \
                --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed — user input needed for ${{ inputs.platform }}: ${NEEDS_USER:0:200}\"}}"
              exit 1
            fi

            echo ">>> Autofix applied, retry attempt $((attempt+1))/$MAX_RETRIES..."
          done

          if [ "$BUILD_EXIT" -ne 0 ]; then
            curl -sf --location 'https://api.onesignal.com/notifications' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Basic ${ONESIGNALAPI}" \
              --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed for ${{ inputs.platform }}\"}}"
          fi

          exit "$BUILD_EXIT"


      # Hand the build outputs to the server (it downloads this artifact by name).
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-build
          if-no-files-found: ignore
          path: |
            ${{ env.ipa-path }}
            ${{ env.pkg-path }}

  # ── Windows ────────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    environment: ${{ inputs.env_id }}
    if: inputs.platform == 'Windows'
    steps:
      - uses: actions/checkout@v4

      - name: Build & Auto-fix
        shell: bash
        env:
          PROJECTURL:       ${{ secrets.PROJECTURL }}
          ONESIGNALAPI:     ${{ secrets.ONESIGNALAPI }}
          ONESIGNAL_SUB_ID: ${{ secrets.ONESIGNAL_SUB_ID }}
          AI_API_KEY:       ${{ secrets.AI_API_KEY }}
          GH_TOKEN:         ${{ secrets.PAT }}
        run: |
          # shell: bash runs with -e -o pipefail here; let a failed attempt reach the
          # report + auto-fix below instead of ending the step.
          set +e +o pipefail
          MAX_RETRIES=5
          for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do
            bash .github/scripts/build.sh Windows 2>&1 | tee /tmp/build_output.txt
            BUILD_EXIT=${PIPESTATUS[0]}
            [ "$BUILD_EXIT" -eq 0 ] && break

            [ "${{ inputs.retry }}" == "true" ] && break

            # Post the failure to the live feed issue before auto-fix starts, so the
            # real build error can be read while the run is still going.
            { echo "**${{ inputs.platform }}** build failed (attempt $attempt): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; echo 'Errors:'; echo '```'; grep -E ' error |error:|ERROR' /tmp/build_output.txt | sort -u | head -150; echo '```'; echo 'Log tail:'; echo '```'; tail -c 40000 /tmp/build_output.txt; echo '```'; } > /tmp/build_report.md
            GH_TOKEN="${{ github.token }}" gh issue comment 1 -R "${{ github.repository }}" --body-file /tmp/build_report.md || true

            bash .github/scripts/autofix.sh \
              --provider "${{ inputs.ai_provider }}" \
              --model    "${{ inputs.ai_model }}" \
              --api-key  "$AI_API_KEY" \
              --build-cmd "dotnet build SampleApp/SampleApp.csproj" \
              --prompt   "GitHub Actions build failed for platform Windows. Full output:\n$(cat /tmp/build_output.txt)\nFix .github/scripts/build.sh or SampleApp/ files. Do NOT touch .github/workflows/build.yml.\n\nIMPORTANT: If you see casting errors with App.SharedVariables, look at how the variable is assigned in the code and find its real type. NEVER cast to dynamic — it breaks under AOT."

            if [ -f .autofix-needs-user.md ]; then
              NEEDS_USER=$(cat .autofix-needs-user.md)
              echo "=== AI requires user input ==="
              echo "$NEEDS_USER"
              curl -sf --location 'https://api.onesignal.com/notifications' \
                --header 'Content-Type: application/json' \
                --header "Authorization: Basic ${ONESIGNALAPI}" \
                --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed — user input needed for Windows: ${NEEDS_USER:0:200}\"}}"
              exit 1
            fi

            echo ">>> Autofix applied, retry attempt $((attempt+1))/$MAX_RETRIES..."
          done

          if [ "$BUILD_EXIT" -ne 0 ]; then
            curl -sf --location 'https://api.onesignal.com/notifications' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Basic ${ONESIGNALAPI}" \
              --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed for Windows\"}}"
          fi

          exit "$BUILD_EXIT"


      # Hand the build outputs to the server (it downloads this artifact by name).
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build
          if-no-files-found: ignore
          path: |
            ${{ env.exe-path }}

  # ── Web (WASM → Firebase Hosting) ─────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_id }}
    if: inputs.platform == 'Web'
    steps:
      - uses: actions/checkout@v4

      - name: Build & Auto-fix
        env:
          PROJECTURL:           ${{ secrets.PROJECTURL }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          FIREBASE_PROJECT_ID:  ${{ secrets.FIREBASE_PROJECT_ID }}
          ONESIGNALAPI:         ${{ secrets.ONESIGNALAPI }}
          ONESIGNAL_SUB_ID:     ${{ secrets.ONESIGNAL_SUB_ID }}
          AI_API_KEY:           ${{ secrets.AI_API_KEY }}
          GH_TOKEN:             ${{ secrets.PAT }}
        run: |
          MAX_RETRIES=5
          for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do
            bash .github/scripts/build.sh Web 2>&1 | tee /tmp/build_output.txt
            BUILD_EXIT=${PIPESTATUS[0]}
            [ "$BUILD_EXIT" -eq 0 ] && break

            [ "${{ inputs.retry }}" == "true" ] && break

            # Post the failure to the live feed issue before auto-fix starts, so the
            # real build error can be read while the run is still going.
            { echo "**${{ inputs.platform }}** build failed (attempt $attempt): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; echo 'Errors:'; echo '```'; grep -E ' error |error:|ERROR' /tmp/build_output.txt | sort -u | head -150; echo '```'; echo 'Log tail:'; echo '```'; tail -c 40000 /tmp/build_output.txt; echo '```'; } > /tmp/build_report.md
            GH_TOKEN="${{ github.token }}" gh issue comment 1 -R "${{ github.repository }}" --body-file /tmp/build_report.md || true

            bash .github/scripts/autofix.sh \
              --provider "${{ inputs.ai_provider }}" \
              --model    "${{ inputs.ai_model }}" \
              --api-key  "$AI_API_KEY" \
              --build-cmd "dotnet build SampleApp/SampleApp.csproj" \
              --prompt   "GitHub Actions build failed for platform Web. Full output:\n$(cat /tmp/build_output.txt)\nFix .github/scripts/build.sh or SampleApp.Browser/ files. Do NOT touch .github/workflows/build.yml.\n\nIMPORTANT: If you see casting errors with App.SharedVariables, look at how the variable is assigned in the code and find its real type. NEVER cast to dynamic — it breaks under AOT."

            if [ -f .autofix-needs-user.md ]; then
              NEEDS_USER=$(cat .autofix-needs-user.md)
              echo "=== AI requires user input ==="
              echo "$NEEDS_USER"
              curl -sf --location 'https://api.onesignal.com/notifications' \
                --header 'Content-Type: application/json' \
                --header "Authorization: Basic ${ONESIGNALAPI}" \
                --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed — user input needed for Web: ${NEEDS_USER:0:200}\"}}"
              exit 1
            fi

            echo ">>> Autofix applied, retry attempt $((attempt+1))/$MAX_RETRIES..."
          done

          if [ "$BUILD_EXIT" -ne 0 ]; then
            curl -sf --location 'https://api.onesignal.com/notifications' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Basic ${ONESIGNALAPI}" \
              --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed for Web\"}}"
          fi

          exit "$BUILD_EXIT"

  # ── Website (MauiWeb, NativeAOT) → web-site.tar.gz, then the deploy target ──
  webserver:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_id }}
    if: contains(fromJson('["WebServer","WebCloudRun","WebAzure"]'), inputs.platform)
    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK + NuGet
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotnet
            ~/.nuget/packages
          key: dotnet-ubuntu-webserver-v1
          restore-keys: dotnet-ubuntu-

      - name: Build & Auto-fix
        env:
          PROJECTURL:           ${{ secrets.PROJECTURL }}
          ONESIGNALAPI:         ${{ secrets.ONESIGNALAPI }}
          ONESIGNAL_SUB_ID:     ${{ secrets.ONESIGNAL_SUB_ID }}
          AI_API_KEY:           ${{ secrets.AI_API_KEY }}
          GH_TOKEN:             ${{ secrets.PAT }}
          WEB_DEPLOY_TARGET:    ${{ inputs.platform != 'WebServer' && inputs.platform || '' }}
        run: |
          MAX_RETRIES=5
          for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do
            bash .github/scripts/build.sh WebServer 2>&1 | tee /tmp/build_output.txt
            BUILD_EXIT=${PIPESTATUS[0]}
            [ "$BUILD_EXIT" -eq 0 ] && break

            [ "${{ inputs.retry }}" == "true" ] && break

            { echo "**${{ inputs.platform }}** build failed (attempt $attempt): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; echo 'Errors:'; echo '```'; grep -E ' error |error:|ERROR' /tmp/build_output.txt | sort -u | head -150; echo '```'; echo 'Log tail:'; echo '```'; tail -c 40000 /tmp/build_output.txt; echo '```'; } > /tmp/build_report.md
            GH_TOKEN="${{ github.token }}" gh issue comment 1 -R "${{ github.repository }}" --body-file /tmp/build_report.md || true

            bash .github/scripts/autofix.sh \
              --provider "${{ inputs.ai_provider }}" \
              --model    "${{ inputs.ai_model }}" \
              --api-key  "$AI_API_KEY" \
              --build-cmd "dotnet build SampleApp.Web/SampleApp.Web.csproj" \
              --prompt   "GitHub Actions build failed for platform WebServer (the app as a website: SampleApp.Web, MauiWeb, NativeAOT linux-x64). Full output:\n$(cat /tmp/build_output.txt)\nFix .github/scripts/build.sh, SampleApp.Web/ or SampleApp/ files. Do NOT touch .github/workflows/build.yml.\n\nIMPORTANT: If you see casting errors with App.SharedVariables, look at how the variable is assigned in the code and find its real type. NEVER cast to dynamic — it breaks under AOT."

            if [ -f .autofix-needs-user.md ]; then
              NEEDS_USER=$(cat .autofix-needs-user.md)
              echo "=== AI requires user input ==="
              echo "$NEEDS_USER"
              curl -sf --location 'https://api.onesignal.com/notifications' \
                --header 'Content-Type: application/json' \
                --header "Authorization: Basic ${ONESIGNALAPI}" \
                --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed — user input needed for the website: ${NEEDS_USER:0:200}\"}}"
              exit 1
            fi

            echo ">>> Autofix applied, retry attempt $((attempt+1))/$MAX_RETRIES..."
          done

          if [ "$BUILD_EXIT" -ne 0 ]; then
            curl -sf --location 'https://api.onesignal.com/notifications' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Basic ${ONESIGNALAPI}" \
              --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed for the website\"}}"
          fi

          exit "$BUILD_EXIT"

      # Only this step holds AppMare's deploy key (not the build, where the auto-fix agent runs).
      # The member gave AppMare's service account Cloud Run Admin + Service Account User on their project.
      - name: Deploy to Google Cloud Run
        if: success() && inputs.platform == 'WebCloudRun'
        env:
          APPMARE_GCP_DEPLOYER_KEY: ${{ secrets.APPMARE_GCP_DEPLOYER_KEY }}
          APPMARE_IMAGE_REPOSITORY: ${{ secrets.APPMARE_IMAGE_REPOSITORY }}
          GCP_PROJECT_ID:          ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION:              ${{ secrets.GCP_REGION }}
          CLOUD_RUN_SERVICE:       ${{ secrets.CLOUD_RUN_SERVICE }}
          APPMARE_APP_ID:          ${{ secrets.APPMARE_APP_ID }}
          APPMARE_MEMBER_ID:       ${{ secrets.APPMARE_MEMBER_ID }}
          APPMARE_LICENSE_BINDING: ${{ secrets.APPMARE_LICENSE_BINDING }}
          APPMARE_SITE_TOKEN:      ${{ secrets.APPMARE_SITE_TOKEN }}
          APPMARE_APP_TITLE:       ${{ secrets.APPMARE_APP_TITLE }}
          ONESIGNALAPI:            ${{ secrets.ONESIGNALAPI }}
          ONESIGNAL_SUB_ID:        ${{ secrets.ONESIGNAL_SUB_ID }}
        run: |
          if ! bash .github/scripts/build.sh WebCloudRunDeploy; then
            curl -sf --location 'https://api.onesignal.com/notifications' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Basic ${ONESIGNALAPI}" \
              --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Website deploy to Google Cloud Run failed\"}}" || true
            exit 1
          fi

      # Only this step holds the member's Microsoft sign-in.
      - name: Deploy to Azure App Service
        if: success() && inputs.platform == 'WebAzure'
        env:
          AZURE_REFRESH_TOKEN:     ${{ secrets.AZURE_REFRESH_TOKEN }}
          AZURE_CLIENT_ID:         ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:     ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID:         ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID:   ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION:          ${{ secrets.AZURE_LOCATION }}
          AZURE_RESOURCE_GROUP:    ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_PLAN:              ${{ secrets.AZURE_PLAN }}
          AZURE_WEBAPP:            ${{ secrets.AZURE_WEBAPP }}
          APPMARE_APP_ID:          ${{ secrets.APPMARE_APP_ID }}
          APPMARE_MEMBER_ID:       ${{ secrets.APPMARE_MEMBER_ID }}
          APPMARE_LICENSE_BINDING: ${{ secrets.APPMARE_LICENSE_BINDING }}
          APPMARE_SITE_TOKEN:      ${{ secrets.APPMARE_SITE_TOKEN }}
          APPMARE_APP_TITLE:       ${{ secrets.APPMARE_APP_TITLE }}
          ONESIGNALAPI:            ${{ secrets.ONESIGNALAPI }}
          ONESIGNAL_SUB_ID:        ${{ secrets.ONESIGNAL_SUB_ID }}
        run: |
          if ! bash .github/scripts/build.sh WebAzureDeploy; then
            curl -sf --location 'https://api.onesignal.com/notifications' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Basic ${ONESIGNALAPI}" \
              --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Website deploy to Azure App Service failed\"}}" || true
            exit 1
          fi

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WebServer-build
          path: web-site.tar.gz
          retention-days: 7
