name: AppMare Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build target'
        required: true
        type: choice
        options:
          - Androidnewapk
          - androidkeystore
          - playnew
          - playkey
          - IOS
          - MAC
          - Windows
          - Web
      track:
        description: 'Play Store track (Android Play only)'
        type: choice
        options: [production, beta, alpha, internal]
        default: production
      env_id:
        description: 'Environment ID (set by AppMare, contains build secrets)'
        required: true
        type: string
      ai_provider:
        description: 'AI provider for auto-fix (anthropic | openai | google | groq | openrouter)'
        type: string
        default: anthropic
      ai_model:
        description: 'AI model for auto-fix (e.g. claude-sonnet-4-5, gpt-4o)'
        type: string
        default: claude-sonnet-4-5
      retry:
        description: 'Auto-retry flag (set by bot, do not set manually)'
        type: boolean
        default: false

jobs:

  # ── Android ────────────────────────────────────────────────────────────────
  android:
    runs-on: macos-latest
    environment: ${{ inputs.env_id }}
    if: contains(fromJson('["Androidnewapk","androidkeystore","playnew","playkey"]'), inputs.platform)
    steps:
      - uses: actions/checkout@v4

      - name: Build & Auto-fix
        env:
          PROJECTURL:       ${{ secrets.PROJECTURL }}
          KEYSTOREALIAS:    ${{ secrets.KEYSTOREALIAS }}
          KEYSTOREPASS:     ${{ secrets.KEYSTOREPASS }}
          KEYURL:           ${{ secrets.KEYURL }}
          PLAYDATA:         ${{ secrets.PLAYDATA }}
          PLAY_TRACK:       ${{ inputs.track }}
          ONESIGNALAPI:     ${{ secrets.ONESIGNALAPI }}
          ONESIGNAL_SUB_ID: ${{ secrets.ONESIGNAL_SUB_ID }}
          AI_API_KEY:       ${{ secrets.AI_API_KEY }}
          GH_TOKEN:         ${{ secrets.PAT }}
        run: |
          MAX_RETRIES=5
          for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do
            bash .github/scripts/build.sh "${{ inputs.platform }}" 2>&1 | tee /tmp/build_output.txt
            BUILD_EXIT=${PIPESTATUS[0]}

            # Upload artifacts regardless
            if [ -n "${aab-path:-}" ] || [ -n "${apk-path:-}" ] || [ -n "${key-path:-}" ] || [ -n "${creds-path:-}" ]; then
              echo "Artifacts found — would upload in separate step"
            fi

            [ "$BUILD_EXIT" -eq 0 ] && break

            # Don't autofix on re-triggered runs
            [ "${{ inputs.retry }}" == "true" ] && break

            bash .github/scripts/autofix.sh \
              --provider "${{ inputs.ai_provider }}" \
              --model    "${{ inputs.ai_model }}" \
              --api-key  "$AI_API_KEY" \
              --build-cmd "dotnet build SampleApp/SampleApp.csproj" \
              --prompt   "GitHub Actions build failed for platform ${{ inputs.platform }}. Full output:\n$(cat /tmp/build_output.txt)\nFix .github/scripts/build.sh or SampleApp/ files. Do NOT touch .github/workflows/build.yml.\n\nIMPORTANT: If you see casting errors with App.SharedVariables, look at how the variable is assigned in the code and find its real type. NEVER cast to dynamic — it breaks under AOT."

            # Check if AI needs user input
            if [ -f .autofix-needs-user.md ]; then
              NEEDS_USER=$(cat .autofix-needs-user.md)
              echo "=== AI requires user input ==="
              echo "$NEEDS_USER"
              curl -sf --location 'https://api.onesignal.com/notifications' \
                --header 'Content-Type: application/json' \
                --header "Authorization: Basic ${ONESIGNALAPI}" \
                --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed — user input needed for ${{ inputs.platform }}: ${NEEDS_USER:0:200}\"}}"
              exit 1
            fi

            # Check if AI didn't change anything (couldn't determine root cause)
            if git diff --stat --quiet; then
              echo "=== AI could not determine the root cause ==="
              BUILD_EXIT=1
              break
            fi

            echo ">>> Autofix applied, retry attempt $((attempt+1))/$MAX_RETRIES..."
          done

          # Notify only after the final result
          if [ "$BUILD_EXIT" -ne 0 ]; then
            curl -sf --location 'https://api.onesignal.com/notifications' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Basic ${ONESIGNALAPI}" \
              --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed for ${{ inputs.platform }}\"}}"
          fi

          exit "$BUILD_EXIT"

  # ── Apple (iOS + macOS) ───────────────────────────────────────────────────
  apple:
    runs-on: macos-15
    environment: ${{ inputs.env_id }}
    if: inputs.platform == 'IOS' || inputs.platform == 'MAC'
    steps:
      - uses: actions/checkout@v4

      - name: Build & Auto-fix
        env:
          PROJECTURL:       ${{ secrets.PROJECTURL }}
          APIKEY:           ${{ secrets.APIKEY }}
          KEYID:            ${{ secrets.KEYID }}
          ISSUERID:         ${{ secrets.ISSUERID }}
          PAT:              ${{ secrets.PAT }}
          GITURL:           ${{ secrets.GITURL }}
          ONESIGNALAPI:     ${{ secrets.ONESIGNALAPI }}
          ONESIGNAL_SUB_ID: ${{ secrets.ONESIGNAL_SUB_ID }}
          AI_API_KEY:       ${{ secrets.AI_API_KEY }}
          GH_TOKEN:         ${{ secrets.PAT }}
        run: |
          MAX_RETRIES=5
          for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do
            bash .github/scripts/build.sh "${{ inputs.platform }}" 2>&1 | tee /tmp/build_output.txt
            BUILD_EXIT=${PIPESTATUS[0]}
            [ "$BUILD_EXIT" -eq 0 ] && break

            [ "${{ inputs.retry }}" == "true" ] && break

            bash .github/scripts/autofix.sh \
              --provider "${{ inputs.ai_provider }}" \
              --model    "${{ inputs.ai_model }}" \
              --api-key  "$AI_API_KEY" \
              --build-cmd "dotnet build SampleApp/SampleApp.csproj" \
              --prompt   "GitHub Actions build failed for platform ${{ inputs.platform }}. Full output:\n$(cat /tmp/build_output.txt)\nFix .github/scripts/build.sh or SampleApp/ files. Do NOT touch .github/workflows/build.yml.\n\nIMPORTANT: If you see casting errors with App.SharedVariables, look at how the variable is assigned in the code and find its real type. NEVER cast to dynamic — it breaks under AOT."

            if [ -f .autofix-needs-user.md ]; then
              NEEDS_USER=$(cat .autofix-needs-user.md)
              echo "=== AI requires user input ==="
              echo "$NEEDS_USER"
              curl -sf --location 'https://api.onesignal.com/notifications' \
                --header 'Content-Type: application/json' \
                --header "Authorization: Basic ${ONESIGNALAPI}" \
                --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed — user input needed for ${{ inputs.platform }}: ${NEEDS_USER:0:200}\"}}"
              exit 1
            fi

            if git diff --stat --quiet; then
              echo "=== AI could not determine the root cause ==="
              BUILD_EXIT=1
              break
            fi

            echo ">>> Autofix applied, retry attempt $((attempt+1))/$MAX_RETRIES..."
          done

          if [ "$BUILD_EXIT" -ne 0 ]; then
            curl -sf --location 'https://api.onesignal.com/notifications' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Basic ${ONESIGNALAPI}" \
              --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed for ${{ inputs.platform }}\"}}"
          fi

          exit "$BUILD_EXIT"

  # ── Windows ────────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    environment: ${{ inputs.env_id }}
    if: inputs.platform == 'Windows'
    steps:
      - uses: actions/checkout@v4

      - name: Build & Auto-fix
        shell: bash
        env:
          PROJECTURL:       ${{ secrets.PROJECTURL }}
          ONESIGNALAPI:     ${{ secrets.ONESIGNALAPI }}
          ONESIGNAL_SUB_ID: ${{ secrets.ONESIGNAL_SUB_ID }}
          AI_API_KEY:       ${{ secrets.AI_API_KEY }}
          GH_TOKEN:         ${{ secrets.PAT }}
        run: |
          MAX_RETRIES=5
          for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do
            bash .github/scripts/build.sh Windows 2>&1 | tee /tmp/build_output.txt
            BUILD_EXIT=${PIPESTATUS[0]}
            [ "$BUILD_EXIT" -eq 0 ] && break

            [ "${{ inputs.retry }}" == "true" ] && break

            bash .github/scripts/autofix.sh \
              --provider "${{ inputs.ai_provider }}" \
              --model    "${{ inputs.ai_model }}" \
              --api-key  "$AI_API_KEY" \
              --build-cmd "dotnet build SampleApp/SampleApp.csproj" \
              --prompt   "GitHub Actions build failed for platform Windows. Full output:\n$(cat /tmp/build_output.txt)\nFix .github/scripts/build.sh or SampleApp/ files. Do NOT touch .github/workflows/build.yml.\n\nIMPORTANT: If you see casting errors with App.SharedVariables, look at how the variable is assigned in the code and find its real type. NEVER cast to dynamic — it breaks under AOT."

            if [ -f .autofix-needs-user.md ]; then
              NEEDS_USER=$(cat .autofix-needs-user.md)
              echo "=== AI requires user input ==="
              echo "$NEEDS_USER"
              curl -sf --location 'https://api.onesignal.com/notifications' \
                --header 'Content-Type: application/json' \
                --header "Authorization: Basic ${ONESIGNALAPI}" \
                --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed — user input needed for Windows: ${NEEDS_USER:0:200}\"}}"
              exit 1
            fi

            if git diff --stat --quiet; then
              echo "=== AI could not determine the root cause ==="
              BUILD_EXIT=1
              break
            fi

            echo ">>> Autofix applied, retry attempt $((attempt+1))/$MAX_RETRIES..."
          done

          if [ "$BUILD_EXIT" -ne 0 ]; then
            curl -sf --location 'https://api.onesignal.com/notifications' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Basic ${ONESIGNALAPI}" \
              --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed for Windows\"}}"
          fi

          exit "$BUILD_EXIT"

  # ── Web (WASM → Firebase Hosting) ─────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_id }}
    if: inputs.platform == 'Web'
    steps:
      - uses: actions/checkout@v4

      - name: Build & Auto-fix
        env:
          PROJECTURL:           ${{ secrets.PROJECTURL }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          FIREBASE_PROJECT_ID:  ${{ secrets.FIREBASE_PROJECT_ID }}
          ONESIGNALAPI:         ${{ secrets.ONESIGNALAPI }}
          ONESIGNAL_SUB_ID:     ${{ secrets.ONESIGNAL_SUB_ID }}
          AI_API_KEY:           ${{ secrets.AI_API_KEY }}
          GH_TOKEN:             ${{ secrets.PAT }}
        run: |
          MAX_RETRIES=5
          for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do
            bash .github/scripts/build.sh Web 2>&1 | tee /tmp/build_output.txt
            BUILD_EXIT=${PIPESTATUS[0]}
            [ "$BUILD_EXIT" -eq 0 ] && break

            [ "${{ inputs.retry }}" == "true" ] && break

            bash .github/scripts/autofix.sh \
              --provider "${{ inputs.ai_provider }}" \
              --model    "${{ inputs.ai_model }}" \
              --api-key  "$AI_API_KEY" \
              --build-cmd "dotnet build SampleApp/SampleApp.csproj" \
              --prompt   "GitHub Actions build failed for platform Web. Full output:\n$(cat /tmp/build_output.txt)\nFix .github/scripts/build.sh or SampleApp.Browser/ files. Do NOT touch .github/workflows/build.yml.\n\nIMPORTANT: If you see casting errors with App.SharedVariables, look at how the variable is assigned in the code and find its real type. NEVER cast to dynamic — it breaks under AOT."

            if [ -f .autofix-needs-user.md ]; then
              NEEDS_USER=$(cat .autofix-needs-user.md)
              echo "=== AI requires user input ==="
              echo "$NEEDS_USER"
              curl -sf --location 'https://api.onesignal.com/notifications' \
                --header 'Content-Type: application/json' \
                --header "Authorization: Basic ${ONESIGNALAPI}" \
                --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed — user input needed for Web: ${NEEDS_USER:0:200}\"}}"
              exit 1
            fi

            if git diff --stat --quiet; then
              echo "=== AI could not determine the root cause ==="
              BUILD_EXIT=1
              break
            fi

            echo ">>> Autofix applied, retry attempt $((attempt+1))/$MAX_RETRIES..."
          done

          if [ "$BUILD_EXIT" -ne 0 ]; then
            curl -sf --location 'https://api.onesignal.com/notifications' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Basic ${ONESIGNALAPI}" \
              --data "{\"app_id\": \"897e14e3-7897-4206-aa80-ee2fd35c7c0d\", \"include_subscription_ids\": [\"${ONESIGNAL_SUB_ID}\"], \"contents\": {\"en\": \"❌ Build failed for Web\"}}"
          fi

          exit "$BUILD_EXIT"
