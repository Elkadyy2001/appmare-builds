name: AppMare Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build target'
        required: true
        type: choice
        options:
          - Androidnewapk
          - androidkeystore
          - playnew
          - playkey
          - IOS
          - MAC
          - Windows
          - Web
      track:
        description: 'Play Store track (Android Play only)'
        type: choice
        options: [production, beta, alpha, internal]
        default: production
      env_id:
        description: 'Environment ID (set by AppMare, contains build secrets)'
        required: true
        type: string
      ai_provider:
        description: 'AI provider for auto-fix (anthropic | openai | google | groq | openrouter)'
        type: string
        default: anthropic
      ai_model:
        description: 'AI model for auto-fix (e.g. claude-sonnet-4-5, gpt-4o)'
        type: string
        default: claude-sonnet-4-5
      retry:
        description: 'Auto-retry flag (set by bot, do not set manually)'
        type: boolean
        default: false

jobs:

  # ── Android ────────────────────────────────────────────────────────────────
  android:
    runs-on: macos-latest
    environment: ${{ inputs.env_id }}
    if: contains(fromJson('["Androidnewapk","androidkeystore","playnew","playkey"]'), inputs.platform)
    steps:
      - uses: actions/checkout@v4

      - name: Build & Auto-fix
        env:
          PROJECTURL:       ${{ secrets.PROJECTURL }}
          KEYSTOREALIAS:    ${{ secrets.KEYSTOREALIAS }}
          KEYSTOREPASS:     ${{ secrets.KEYSTOREPASS }}
          KEYURL:           ${{ secrets.KEYURL }}
          PLAYDATA:         ${{ secrets.PLAYDATA }}
          PLAY_TRACK:       ${{ inputs.track }}
          ONESIGNALAPI:     ${{ secrets.ONESIGNALAPI }}
          ONESIGNAL_SUB_ID: ${{ secrets.ONESIGNAL_SUB_ID }}
          AI_API_KEY:       ${{ secrets.AI_API_KEY }}
          GH_TOKEN:         ${{ secrets.PAT }}
        run: |
          # Run the build, capture ALL output
          bash .github/scripts/build.sh "${{ inputs.platform }}" 2>&1 | tee /tmp/build_output.txt
          BUILD_EXIT=${PIPESTATUS[0]}

          # Upload artifacts regardless
          if [ -n "${aab-path:-}" ] || [ -n "${apk-path:-}" ] || [ -n "${key-path:-}" ] || [ -n "${creds-path:-}" ]; then
            echo "Artifacts found — would upload in separate step"
          fi

          # If build failed, pass the full log to autofix
          if [ "$BUILD_EXIT" -ne 0 ] && [ "${{ inputs.retry }}" == "false" ]; then
            bash .github/scripts/autofix.sh \
              --provider "${{ inputs.ai_provider }}" \
              --model    "${{ inputs.ai_model }}" \
              --api-key  "$AI_API_KEY" \
              --prompt   "GitHub Actions build failed for platform ${{ inputs.platform }}. Full output:\n$(cat /tmp/build_output.txt)\nFix .github/scripts/build.sh or SampleApp/ files. Do NOT touch .github/workflows/build.yml."
            git config user.email "bot@appmare.io"
            git config user.name "AppMare Bot"
            git add -A
            git commit -m "Auto-fix: ${{ inputs.platform }}" && git push || echo "Nothing to commit"
            gh workflow run build.yml \
              -f platform="${{ inputs.platform }}" \
              -f track="${{ inputs.track }}" \
              -f env_id="${{ inputs.env_id }}" \
              -f ai_provider="${{ inputs.ai_provider }}" \
              -f ai_model="${{ inputs.ai_model }}" \
              -f retry=true
          fi

          exit "$BUILD_EXIT"

  # ── Apple (iOS + macOS) ───────────────────────────────────────────────────
  apple:
    runs-on: macos-15
    environment: ${{ inputs.env_id }}
    if: inputs.platform == 'IOS' || inputs.platform == 'MAC'
    steps:
      - uses: actions/checkout@v4

      - name: Build & Auto-fix
        env:
          PROJECTURL:       ${{ secrets.PROJECTURL }}
          APIKEY:           ${{ secrets.APIKEY }}
          KEYID:            ${{ secrets.KEYID }}
          ISSUERID:         ${{ secrets.ISSUERID }}
          PAT:              ${{ secrets.PAT }}
          GITURL:           ${{ secrets.GITURL }}
          ONESIGNALAPI:     ${{ secrets.ONESIGNALAPI }}
          ONESIGNAL_SUB_ID: ${{ secrets.ONESIGNAL_SUB_ID }}
          AI_API_KEY:       ${{ secrets.AI_API_KEY }}
          GH_TOKEN:         ${{ secrets.PAT }}
        run: |
          # Run the build, capture ALL output
          bash .github/scripts/build.sh "${{ inputs.platform }}" 2>&1 | tee /tmp/build_output.txt
          BUILD_EXIT=${PIPESTATUS[0]}

          # If build failed, pass the full log to autofix
          if [ "$BUILD_EXIT" -ne 0 ] && [ "${{ inputs.retry }}" == "false" ]; then
            bash .github/scripts/autofix.sh \
              --provider "${{ inputs.ai_provider }}" \
              --model    "${{ inputs.ai_model }}" \
              --api-key  "$AI_API_KEY" \
              --prompt   "GitHub Actions build failed for platform ${{ inputs.platform }}. Full output:\n$(cat /tmp/build_output.txt)\nFix .github/scripts/build.sh or SampleApp/ files. Do NOT touch .github/workflows/build.yml."
            git config user.email "bot@appmare.io"
            git config user.name "AppMare Bot"
            git add -A
            git commit -m "Auto-fix: ${{ inputs.platform }}" && git push || echo "Nothing to commit"
            gh workflow run build.yml \
              -f platform="${{ inputs.platform }}" \
              -f env_id="${{ inputs.env_id }}" \
              -f ai_provider="${{ inputs.ai_provider }}" \
              -f ai_model="${{ inputs.ai_model }}" \
              -f retry=true
          fi

          exit "$BUILD_EXIT"

  # ── Windows ────────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    environment: ${{ inputs.env_id }}
    if: inputs.platform == 'Windows'
    steps:
      - uses: actions/checkout@v4

      - name: Build & Auto-fix
        shell: bash
        env:
          PROJECTURL:       ${{ secrets.PROJECTURL }}
          ONESIGNALAPI:     ${{ secrets.ONESIGNALAPI }}
          ONESIGNAL_SUB_ID: ${{ secrets.ONESIGNAL_SUB_ID }}
          AI_API_KEY:       ${{ secrets.AI_API_KEY }}
          GH_TOKEN:         ${{ secrets.PAT }}
        run: |
          # Run the build, capture ALL output
          bash .github/scripts/build.sh Windows 2>&1 | tee /tmp/build_output.txt
          BUILD_EXIT=${PIPESTATUS[0]}

          # If build failed, pass the full log to autofix
          if [ "$BUILD_EXIT" -ne 0 ] && [ "${{ inputs.retry }}" == "false" ]; then
            bash .github/scripts/autofix.sh \
              --provider "${{ inputs.ai_provider }}" \
              --model    "${{ inputs.ai_model }}" \
              --api-key  "$AI_API_KEY" \
              --prompt   "GitHub Actions build failed for platform Windows. Full output:\n$(cat /tmp/build_output.txt)\nFix .github/scripts/build.sh or SampleApp/ files. Do NOT touch .github/workflows/build.yml."
            git config user.email "bot@appmare.io"
            git config user.name "AppMare Bot"
            git add -A
            git commit -m "Auto-fix: Windows" && git push || echo "Nothing to commit"
            gh workflow run build.yml \
              -f platform="Windows" \
              -f env_id="${{ inputs.env_id }}" \
              -f ai_provider="${{ inputs.ai_provider }}" \
              -f ai_model="${{ inputs.ai_model }}" \
              -f retry=true
          fi

          exit "$BUILD_EXIT"

  # ── Web (WASM → Firebase Hosting) ─────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_id }}
    if: inputs.platform == 'Web'
    steps:
      - uses: actions/checkout@v4

      - name: Build & Auto-fix
        env:
          PROJECTURL:           ${{ secrets.PROJECTURL }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          FIREBASE_PROJECT_ID:  ${{ secrets.FIREBASE_PROJECT_ID }}
          ONESIGNALAPI:         ${{ secrets.ONESIGNALAPI }}
          ONESIGNAL_SUB_ID:     ${{ secrets.ONESIGNAL_SUB_ID }}
          AI_API_KEY:           ${{ secrets.AI_API_KEY }}
          GH_TOKEN:             ${{ secrets.PAT }}
        run: |
          # Run the build + deploy, capture ALL output
          bash .github/scripts/build.sh Web 2>&1 | tee /tmp/build_output.txt
          BUILD_EXIT=${PIPESTATUS[0]}

          # If build failed, pass the full log to autofix
          if [ "$BUILD_EXIT" -ne 0 ] && [ "${{ inputs.retry }}" == "false" ]; then
            bash .github/scripts/autofix.sh \
              --provider "${{ inputs.ai_provider }}" \
              --model    "${{ inputs.ai_model }}" \
              --api-key  "$AI_API_KEY" \
              --prompt   "GitHub Actions build failed for platform Web. Full output:\n$(cat /tmp/build_output.txt)\nFix .github/scripts/build.sh or SampleApp.Browser/ files. Do NOT touch .github/workflows/build.yml."
            git config user.email "bot@appmare.io"
            git config user.name "AppMare Bot"
            git add -A
            git commit -m "Auto-fix: Web" && git push || echo "Nothing to commit"
            gh workflow run build.yml \
              -f platform="Web" \
              -f env_id="${{ inputs.env_id }}" \
              -f ai_provider="${{ inputs.ai_provider }}" \
              -f ai_model="${{ inputs.ai_model }}" \
              -f retry=true
          fi

          exit "$BUILD_EXIT"
